name: Metaculus — forecast on FutureEval tournament + MiniBench
on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"
concurrency:
  group: metaculus-bot
  cancel-in-progress: false
jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install forecasting-tools python-dotenv
      - run: python metaculus/bot.py --mode tournament
        env:
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ASKNEWS_CLIENT_ID: ${{ secrets.ASKNEWS_CLIENT_ID }}
          ASKNEWS_SECRET: ${{ secrets.ASKNEWS_SECRET }}
          OPENFORECAST_MODEL: ${{ vars.OPENFORECAST_MODEL }}
      - run: python metaculus/bot.py --mode minibench
        env:
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ASKNEWS_CLIENT_ID: ${{ secrets.ASKNEWS_CLIENT_ID }}
          ASKNEWS_SECRET: ${{ secrets.ASKNEWS_SECRET }}
          OPENFORECAST_MODEL: ${{ vars.OPENFORECAST_MODEL }}
