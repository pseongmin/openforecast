<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="XCross">
  <title>XCross</title>
  <rect width="256" height="256" rx="44" fill="#0B1220"/>
  <!-- Descending stroke: the crossing. Ascending stroke: the forecast, ending in a marked point. -->
  <line x1="70" y1="70" x2="186" y2="186" stroke="#4DA3FF" stroke-width="26" stroke-linecap="round"/>
  <line x1="70" y1="186" x2="186" y2="70" stroke="#7CE7B0" stroke-width="26" stroke-linecap="round"/>
  <circle cx="186" cy="70" r="20" fill="#7CE7B0"/>
  <circle cx="186" cy="70" r="8" fill="#0B1220"/>
</svg>
